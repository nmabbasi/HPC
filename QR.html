            width: 100% !important;

        }
        
        .navbar-wrapper {
            width: 100% !important;
            max-width: 1000px !important;
        }

    <style>
        :root {

            --text-main: #334155;          /* Softer black for readable text */

            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif !important;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Paragraphs and Text */

            font-size: 1.15rem;

            margin-bottom: 1.6rem;
            text-align: justify !important;
        }

        /* Typography */
        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif !important;
            font-weight: 700 !important;
            color: var(--text-heading) !important;
            line-height: 1.3;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
        }
        
        h1 {
            font-size: 3rem !important;
            font-weight: 800 !important;
            letter-spacing: -0.03em;
            border-bottom: 5px solid var(--primary-blue) !important;
            padding-bottom: 15px;
            display: inline-block; /* Makes the border only as wide as the text */
            margin-bottom: 3rem;
            margin-top: 0 !important;
        }
        
        h2 { font-size: 2rem !important; letter-spacing: -0.01em; }
        h3 { font-size: 1.5rem !important; }

        /* Modern Navbar */
        .navbar-inverse {
            background: var(--dark-slate) !important;
            border: none !important;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15) !important;
            padding: 12px 0 !important;
        }
        
        .navbar-inner {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        
        .navbar-inverse .nav > li > a {
            color: #cbd5e1 !important; /* Slate-300 */
            font-family: 'Outfit', sans-serif !important;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            text-shadow: none !important;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 10px 12px !important;
            margin: 0 6px;
            border-radius: 8px;
        }
        
        .navbar-inverse .nav > li > a:hover,
        .navbar-inverse .nav > li.active > a,
        .navbar-inverse .nav > li.active.dropdown > a,
        .navbar-inverse .nav li.dropdown.open > .dropdown-toggle {
            color: #ffffff !important;
            background: var(--primary-blue) !important; /* Vibrant Blue */
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4) !important;
        }

        /* Dropdown Menus */
        .dropdown-menu {
            border-radius: 12px !important;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(15, 23, 42, 0.05) !important;
            border: none !important;
            padding: 12px 0 !important;
            background: #ffffff !important;
            border-top: 4px solid var(--primary-blue) !important;
            margin-top: 15px !important;
            min-width: 220px;
        }
        
        .dropdown-menu > li > a {
            padding: 14px 30px !important;
            font-family: 'Inter', sans-serif !important;
            font-weight: 500 !important;
            color: var(--text-heading) !important;
            transition: all 0.2s ease;
        }
        
        .dropdown-menu > li > a:hover,
        .dropdown-menu > li.active > a {
            background-color: var(--text-heading) !important; /* Solid Slate Black */
            color: #ffffff !important; /* White Text */
            padding-left: 36px !important; /* Interactive indent animation */
            font-weight: 600 !important;
        }

        /* Mac-Style Code Blocks */
        pre {
            background-color: #1e293b !important; /* Slate-800 */
            color: #f8fafc !important; /* Slate-50 */
            border: none !important;
            border-radius: 12px !important;
            padding: 24px !important;
            padding-top: 45px !important; /* Room for Mac buttons */
            font-size: 0.95rem !important;
            font-family: 'Fira Code', 'Consolas', monospace !important;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.15) !important;
            overflow-x: auto;
            line-height: 1.6;
            position: relative;
        }
        
        pre::before {
            content: '';
            display: block;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ef4444; /* Mac red button */
            box-shadow: 20px 0 0 #f59e0b, 40px 0 0 #10b981; /* Yellow and green */
            position: absolute;
            top: 16px;
            left: 18px;
        }
        
        pre code {
            display: block;
            color: inherit !important;
            background: transparent !important;
            padding: 0 !important;
            font-weight: 400 !important;
        }

        /* Inline Code */
        code {
            font-family: 'Fira Code', 'Consolas', monospace !important;
            color: #be123c; /* Rose-700 */
            background-color: #ffe4e6; /* Rose-50 */
            border-radius: 6px;
            padding: 0.2em 0.5em;
            font-size: 0.9em;
            font-weight: 600;
        }

        /* Images */
        img {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
            margin: 40px auto;
            max-width: 100%;
            height: auto;
            display: block;
            border: 1px solid var(--border-color);
        }
        
        /* Dividers */
        hr {
            border: 0;
            height: 1px;
            background: var(--border-color) !important;
            margin: 60px 0;
        }
        
        /* Links */
        a {
            color: var(--primary-blue);
            transition: all 0.2s ease;
            text-decoration: none !important;
            font-weight: 600;
        }
        
        a:hover {
            color: #1e3a8a; /* Blue-900 */
            text-decoration: underline !important;
        }

        li { margin-bottom: 0.6rem; }
        
        /* Caret icon inside navbar */
